<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CI/CD Todo Practice</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-panel" aria-labelledby="app-title">
        <div class="panel-header">
          <p class="eyebrow">Deployment Practice</p>
          <h1 id="app-title">Todo List</h1>
          <p class="summary">Cloudflare CDN과 Cloud Run 자동 배포 연습용 정적 앱입니다.</p>
        </div>

        <form class="todo-form" id="todo-form">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            maxlength="80"
            placeholder="할 일을 입력하세요"
            autocomplete="off"
            required
          >
          <button type="submit">추가</button>
        </form>

        <div class="toolbar" aria-label="Todo 필터">
          <button class="filter-button is-active" type="button" data-filter="all">전체</button>
          <button class="filter-button" type="button" data-filter="active">진행중</button>
          <button class="filter-button" type="button" data-filter="done">완료</button>
        </div>

        <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

        <footer class="todo-footer">
          <span id="todo-count">0개 남음</span>
          <button class="text-button" id="clear-done" type="button">완료 항목 삭제</button>
        </footer>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label>
          <input class="todo-check" type="checkbox">
          <span class="todo-text"></span>
        </label>
        <button class="delete-button" type="button" aria-label="삭제">×</button>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
